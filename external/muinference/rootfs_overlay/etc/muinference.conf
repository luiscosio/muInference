# muinference Weight Enclave Configuration
# This file is included in the enclave measurement hash

# Enclave identity
enclave_name=muinference-weight-enclave
enclave_version=1.0.0

# Network configuration
listen_port=9000
listen_addr=0.0.0.0

# Model configuration
# Using unsloth/Llama-3.2-3B-Instruct from Hugging Face
# https://huggingface.co/unsloth/Llama-3.2-3B-Instruct
model_id=unsloth/Llama-3.2-3B-Instruct
model_path=/opt/models/Llama-3.2-3B-Instruct

# Security settings
# max_egress_rate_kbps: Maximum output bandwidth (for weight exfil protection)
max_egress_rate_kbps=5

# max_request_size_mb: Maximum incoming request size
max_request_size_mb=10

# max_response_tokens: Maximum tokens per response
max_response_tokens=2048

# idle_timeout_sec: Disconnect after idle period (0=disabled)
idle_timeout_sec=0

# Attestation
# In production, these would be derived from TPM/secure boot
attestation_method=measurement_hash
